plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def appVersionCode = 904000 + ciRunNumber
def appVersionName = "0.9.4-alpha.${ciRunNumber}"

def devStore = file("${System.properties['user.home']}/.android/debug.keystore")

android {
    namespace 'com.desarrollamo.plataformamo'
    compileSdk 34

    defaultConfig {
        applicationId "com.desarrollamo.plataformamo.dev"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        dev {
            storeFile devStore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.dev
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
