plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def appVersionCode = 905000 + ciRunNumber
def appVersionName = "0.9.5-security.${ciRunNumber}"
def signingStoreFile = System.getenv('PLATAFORMAMO_KEYSTORE_PATH')
def signingStorePassword = System.getenv('PLATAFORMAMO_STORE_PASSWORD')
def signingKeyAlias = System.getenv('PLATAFORMAMO_KEY_ALIAS')
def signingKeyPassword = System.getenv('PLATAFORMAMO_KEY_PASSWORD')
def releaseSigningRequired = (System.getenv('CI_RELEASE_SIGNING_REQUIRED') ?: 'false').toBoolean()
def hasReleaseSigning = [signingStoreFile, signingStorePassword, signingKeyAlias, signingKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.desarrollamo.plataformamo'
    compileSdk 34

    defaultConfig {
        applicationId "com.desarrollamo.plataformamo.dev"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('secureRelease') {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.secureRelease
            } else if (releaseSigningRequired) {
                throw new GradleException('PlataformAMO signing secrets are required; signing material must never be committed to Git')
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
