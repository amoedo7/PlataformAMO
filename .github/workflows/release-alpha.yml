name: release-alpha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare alpha signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/plataformamo-dev.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Prepare release assets
        id: meta
        run: |
          VERSION="0.9.4-alpha.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          OUT="PlataformAMO-${VERSION}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.apk }}" SHA256SUMS.txt \
            --title "PlataformAMO ${{ steps.meta.outputs.version }}" \
            --notes "Primera distribución Android de PlataformAMO para pruebas a través de StoreAMO. Canal alpha; usa identidad de desarrollo separada de la futura firma estable." \
            --prerelease
