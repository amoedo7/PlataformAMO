name: android-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare alpha signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/plataformamo-dev.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PlataformAMO-alpha
          path: app/build/outputs/apk/release/*.apk
